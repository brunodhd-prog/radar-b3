name: Atualizar dados brapi
on:
  schedule:
    - cron: "7,22,37,52 13-21 * * 1-5"   # a cada 15 min, 10h–18h59 de Brasília (UTC-3), dias úteis
    - cron: "7 */2 * * 0,6"               # cripto também no fim de semana, a cada 2 h
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar histórico
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: |
          if [ "$(date -u +%u)" -lt 6 ]; then node scripts/fetch-brapi.mjs --mercado b3; fi
          node scripts/fetch-brapi.mjs --mercado cripto
      - name: Publicar data/b3.json
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/b3.json data/cripto.json 2>/dev/null || git add data/cripto.json
          git diff --cached --quiet && exit 0
          git commit -m "dados: $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push
