name: Notícias e sentimento
on:
  schedule:
    - cron: "41 11-23 * * 1-5"   # de hora em hora, 8h41–20h41 de Brasília, dias úteis
    - cron: "41 15 * * 0,6"      # uma vez por dia no fim de semana
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados          # mesma fila da rotina da brapi: nunca dois commits ao mesmo tempo
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-noticias.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-pt-br-v1
      - name: Instalar (torch CPU)
        run: pip install -r scripts/requirements-noticias.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Coletar, classificar e avaliar
        run: python scripts/noticias.py
      - name: Publicar data/noticias.json
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/noticias.json
          git diff --cached --quiet && exit 0
          git commit -m "notícias: $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push
